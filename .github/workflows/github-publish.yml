name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Smoke-test the CLI (issue #21)
      - name: Smoke test CLI
        run: node bin/cli.js --help

      # Run unit tests (issue #21)
      - name: Run tests
        run: npm test

  publish-github:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Vital for GitHub registry access

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - run: npm ci

      - name: Rename and Publish to GitHub
        run: |
          # Dynamically lowercase the repo name and set it in package.json
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          npm pkg set name="@$REPO_LOWER"

          # Point the publish registry to GitHub
          npm publish
        env:
          # Uses the built-in GITHUB_TOKEN automatically
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
